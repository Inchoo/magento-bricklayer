name: ci

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: composer check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        experimental: [false]
        include:
          - php: '8.5'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - run: composer validate

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: composer check
